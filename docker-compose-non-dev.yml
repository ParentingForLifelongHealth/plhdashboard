# -----------------------------------------------------------------------
# We don't support docker compose for production environments.
# If you choose to use this type of deployment make sure to
# create you own docker environment file (docker/.env) with your own
# unique random secure passwords and SECRET_KEY.
#
# For verbose logging during development:
# - Set SUPERSET_LOG_LEVEL=debug in docker/.env-local for detailed Superset logs
# -----------------------------------------------------------------------
x-superset-volumes:
  &superset-volumes # /app/pythonpath_docker will be appended to the PYTHONPATH in the final container
  - ./docker:/app/docker
  - superset_home:/app/superset_home
  - ./superset-frontend/packages/superset-ui-core/src/components/assets/images/loading.svg:/app/superset-frontend/packages/superset-ui-core/src/components/assets/images/loading.svg:ro
  - ./custom-images:/app/superset/static/assets/images/custom:ro

x-common-build: &common-build
  context: .
  target: dev
  cache_from:
    - apache/superset-cache:3.10-slim-trixie

services:
  redis:
    image: redis:7
    container_name: superset_cache
    restart: unless-stopped
    volumes:
      - redis:/data
    networks:
      - default


  db:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    image: postgres:16
    container_name: superset_db
    restart: unless-stopped
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superset} -d ${POSTGRES_DB:-superset}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  superset:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    build:
      <<: *common-build
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    user: "root"
    restart: unless-stopped
    # Explicit resolvers: Docker's embedded DNS (127.0.0.11) forwards external
    # lookups to the Docker VM gateway, which on this host is unreachable —
    # *.googleapis.com then fails to resolve and every BigQuery call (dataset
    # registration, chart data) hangs on retries. Egress itself is fine, so
    # naming public resolvers directly restores it. Container-to-container
    # names (superset_db, redis) still resolve via 127.0.0.11.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - 8088:8088
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    networks:
      - default


  superset-init:
    container_name: superset_init
    # same resolver fix — init installs pip requirements, so it needs to
    # resolve pypi.org; without this it fails and BLOCKS superset/worker,
    # which depend on it completing successfully.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      <<: *common-build
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true
    networks:
      - default


  superset-worker:
    build:
      <<: *common-build
    container_name: superset_worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    # same resolver fix as superset_app — the worker runs async chart queries
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes: *superset-volumes
    networks:
      - default

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME",
        ]

  superset-worker-beat:
    build:
      <<: *common-build
    container_name: superset_worker_beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true
    networks:
      - default


  superset-mcp:
    build:
      <<: *common-build
    container_name: superset_mcp
    command: ["/app/docker/docker-bootstrap.sh", "mcp"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    ports:
      - ${MCP_PORT:-5008}:${MCP_PORT:-5008}
    volumes: *superset-volumes
    healthcheck:
      disable: true
    networks:
      - default


volumes:
  superset_home:
    external: false
  db_home:
    external: false
  redis:
    external: false

networks:
  default:
    external:
      name: my_custom_network
