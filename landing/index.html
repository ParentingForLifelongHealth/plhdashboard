<!DOCTYPE html>
<html lang="en" data-theme="bumblebee">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLH Dashboard — Programme Monitoring</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="landing_dashboards.js"></script>
  <link rel="stylesheet" href="landing_main.css" />
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="/" class="brand">
    <img src="https://plhdashboard.org/static/assets/images/superset-logo-horiz.png" alt="PLH Dashboard" class="brand-logo" />
  </a>
  <div class="brand-pipe"></div>
  <span class="brand-sub" id="nav-sub"></span>
  <div class="nav-spacer"></div>
  <a href="https://plhdashboard.org/dashboard/list/" class="nav-link" target="_blank" rel="noopener">All Dashboards</a>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="g-gold-bar"></div><div class="g-sky-bar"></div>
  <div class="g-sky-patch"></div><div class="g-tri-r"></div>
  <div class="g-circle-lg"></div><div class="g-circle-sm"></div><div class="g-stripes"></div>
  <div class="hero-inner fu d0">
    <h1>Programme <em>Monitoring</em> Dashboards</h1>
  </div>
</section>

<!-- SPLIT LAYOUT -->
<div class="split-layout">

  <!-- LEFT: Dashboard Sidebar -->
  <aside class="sidebar">

    <div class="sidebar-heading">
      <div class="embed-heading">Dashboards</div>
      <div class="embed-heading-bar"></div>
    </div>

    <div class="sidebar-toolbar">
      <div class="tb-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Search dashboards…" oninput="applyFilters();" />
      </div>
      <div class="sidebar-toolbar-row">
        <div class="tb-filters" id="tb-filters"></div>
        <div class="sidebar-view-toggle">
          <button class="view-btn active" id="vbtn-compact" onclick="setView('compact')" title="Tile view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          </button>
          <button class="view-btn" id="vbtn-list" onclick="setView('list')" title="List view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/></svg>
          </button>
          <button class="view-btn" id="vbtn-grouped" onclick="setView('grouped')" title="Group by category">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="17" width="18" height="4" rx="1"/></svg>
          </button>
        </div>
      </div>
      <div class="tb-filters tb-filters-apps" id="tb-filters-apps"></div>
    </div>

    <div class="sidebar-list" id="sidebar-list-body"></div>

    <div class="sidebar-count"><span id="tb-count">—</span> dashboards</div>

  </aside>

  <!-- RIGHT: Global Reach -->
  <main class="reach-panel">

    <div class="reach-header">
      <div>
        <div class="embed-heading">Global Reach</div>
        <div class="embed-heading-bar"></div>
      </div>
      <a href="https://plhdashboard.org/reach"
         target="_blank" rel="noopener" class="embed-open-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open full dashboard
      </a>
    </div>

    <div class="reach-content">

      <!-- Total Reach stat -->
      <div class="reach-stat">
        <div class="embed-col-stat">
          <div class="stat-card-label">
            <div class="stat-card-title">Total Reach</div>
          </div>
          <div class="embed-frame-square">
            <div class="embed-loading">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
              Loading…
            </div>
            <iframe
              src="https://plhdashboard.org/superset/explore/p/MD03Q4QdXOm/?standalone=1&height=400"
              seamless frameborder="0" scrolling="no"
              onload="this.classList.add('loaded')"
              title="Total Reach"
            ></iframe>
          </div>
        </div>
      </div>

      <!-- Map -->
      <div class="reach-map">
        <div class="embed-frame-fill">
          <div class="embed-loading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            Loading dashboard…
          </div>
          <iframe
            src="https://plhdashboard.org/superset/explore/p/LxAgRmxl3pZ/?standalone=1&height=500"
            seamless frameborder="0" scrolling="no"
            onload="this.classList.add('loaded')"
            title="Global Reach Map"
          ></iframe>
        </div>
      </div>

    </div>
  </main>

</div>

<script>
let allDashboards = [];
let activeTag     = 'All';
let activeAppTag  = null;
let currentView   = 'compact';
const delays      = ['d0','d1','d2','d3','d4','d5','d6','d7','d8','d9','d10','d11','d12','d13'];

const tagIcons = { Global: 'globe', Crisis: 'life-buoy', Programme: 'layout-grid' };

// ── Filtering ──────────────────────────────────────────────
function filtered() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  return allDashboards.filter(d => {
    const matchTag    = activeTag === 'All' || d.tag === activeTag;
    const matchAppTag = !activeAppTag || (d.appType || '').split('|').map(t => t.trim()).includes(activeAppTag);
    const matchQ      = !q ||
      d.name.toLowerCase().includes(q) ||
      d.tag.toLowerCase().includes(q)  ||
      (d.appType || '').toLowerCase().includes(q) ||
      d.desc.toLowerCase().includes(q);
    return matchTag && matchAppTag && matchQ;
  });
}

function applyFilters() { render(filtered()); }

// ── View toggle ────────────────────────────────────────────
function setView(v) {
  currentView = v;
  ['compact','list','grouped'].forEach(n => {
    document.getElementById('vbtn-' + n).classList.toggle('active', n === v);
  });
  render(filtered());
}

// ── Render dispatcher ──────────────────────────────────────
function render(list) {
  document.getElementById('tb-count').textContent = list.length;
  if (currentView === 'list')    renderList(list);
  else if (currentView === 'grouped') renderGrouped(list);
  else                           renderCompact(list);
}

// ── List view ──────────────────────────────────────────────
function renderList(list) {
  const body = document.getElementById('sidebar-list-body');
  body.innerHTML = '';
  if (!list.length) { body.innerHTML = '<div class="empty-state">No dashboards found.</div>'; return; }
  list.forEach((d, i) => {
    const a = document.createElement('a');
    a.href = d.url; a.target = '_blank'; a.rel = 'noopener';
    a.className = `group-item fu ${delays[i % delays.length]}`;
    a.innerHTML = `
      <div class="gi-icon icon-${d.accent}"><i data-lucide="${d.icon}"></i></div>
      <div class="gi-body">
        <div class="gi-name">${d.name}</div>
        <div class="gi-desc">${d.tag}${d.appType ? ' · ' + d.appType.split('|').map(t => t.trim()).join(' · ') : ''}</div>
      </div>
      <div class="gi-arrow"><i data-lucide="chevron-right"></i></div>
    `;
    body.appendChild(a);
  });
  lucide.createIcons();
}

// ── Compact tile view ──────────────────────────────────────
function renderCompact(list) {
  const body = document.getElementById('sidebar-list-body');
  body.innerHTML = '';
  if (!list.length) { body.innerHTML = '<div class="empty-state">No dashboards found.</div>'; return; }
  const grid = document.createElement('div');
  grid.className = 'compact-grid';
  list.forEach((d, i) => {
    const a = document.createElement('a');
    a.href = d.url; a.target = '_blank'; a.rel = 'noopener';
    a.className = `compact-tile ct-${d.accent} fu ${delays[i % delays.length]}`;
    a.innerHTML = `
      <div class="ct-icon bg-${d.accent}"><i data-lucide="${d.icon}"></i></div>
      <div class="ct-tag">${d.tag}</div>
      <div class="ct-name">${d.name}</div>
      <div class="ct-open">Open <i data-lucide="arrow-right"></i></div>
    `;
    grid.appendChild(a);
  });
  body.appendChild(grid);
  lucide.createIcons();
}

// ── Grouped view ───────────────────────────────────────────
function renderGrouped(list) {
  const body = document.getElementById('sidebar-list-body');
  body.innerHTML = '';
  if (!list.length) { body.innerHTML = '<div class="empty-state">No dashboards found.</div>'; return; }
  const groups = {};
  list.forEach(d => { (groups[d.tag] = groups[d.tag] || []).push(d); });
  let idx = 0;
  Object.entries(groups).forEach(([tag, items]) => {
    const sec = document.createElement('div');
    sec.className = 'group-section';
    const hdr = document.createElement('div');
    hdr.className = 'group-header';
    hdr.innerHTML = `
      <div class="group-icon"><i data-lucide="${tagIcons[tag] || 'folder'}"></i></div>
      <div class="group-title">${tag}</div>
      <div class="group-count">${items.length}</div>
      <div class="group-line"></div>
    `;
    sec.appendChild(hdr);
    const itemsEl = document.createElement('div');
    itemsEl.className = 'group-items';
    items.forEach(d => {
      const a = document.createElement('a');
      a.href = d.url; a.target = '_blank'; a.rel = 'noopener';
      a.className = `group-item fu ${delays[idx++ % delays.length]}`;
      a.innerHTML = `
        <div class="gi-icon icon-${d.accent}"><i data-lucide="${d.icon}"></i></div>
        <div class="gi-body">
          <div class="gi-name">${d.name}</div>
          <div class="gi-desc">${d.appType ? d.appType.split('|').map(t => t.trim()).join(' · ') : d.tag}</div>
        </div>
        <div class="gi-arrow"><i data-lucide="chevron-right"></i></div>
      `;
      itemsEl.appendChild(a);
    });
    sec.appendChild(itemsEl);
    body.appendChild(sec);
  });
  lucide.createIcons();
}

// ── Build filter tabs ──────────────────────────────────────
function buildTabs(dashboards) {
  const tags  = ['All', ...new Set(dashboards.map(d => d.tag))];
  const elTag = document.getElementById('tb-filters');
  elTag.innerHTML = '';
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tb-tab' + (tag === 'All' ? ' active' : '');
    btn.textContent = tag;
    btn.onclick = () => {
      activeTag    = tag;
      activeAppTag = null;
      document.querySelectorAll('#tb-filters .tb-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('#tb-filters-apps .tb-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('search-input').value = '';
      render(filtered());
    };
    elTag.appendChild(btn);
  });

  const appTypes = [...new Set(dashboards.flatMap(d => (d.appType || '').split('|').map(t => t.trim())).filter(Boolean))];
  const elApp    = document.getElementById('tb-filters-apps');
  elApp.innerHTML = '';
  appTypes.forEach(type => {
    const btn = document.createElement('button');
    btn.className = 'tb-tab tb-tab-app';
    btn.textContent = type;
    btn.onclick = () => {
      if (activeAppTag === type) {
        activeAppTag = null;
        btn.classList.remove('active');
      } else {
        activeAppTag = type;
        activeTag    = 'All';
        document.querySelectorAll('#tb-filters .tb-tab').forEach(b => b.classList.remove('active'));
        document.querySelector('#tb-filters .tb-tab').classList.add('active');
        document.querySelectorAll('#tb-filters-apps .tb-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      document.getElementById('search-input').value = '';
      render(filtered());
    };
    elApp.appendChild(btn);
  });
}

// ── Boot ───────────────────────────────────────────────────
const { site, dashboards } = window.PLH_DATA;
allDashboards = dashboards;

document.title = site.name + ' — M&E Dashboards';
document.getElementById('nav-sub').textContent = site.subtitle;

buildTabs(dashboards);
render(dashboards);
</script>
</body>
</html>
